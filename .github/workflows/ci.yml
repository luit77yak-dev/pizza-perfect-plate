name: Build and Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/reconnect-storefront-components
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install

      - name: Format refactored storefront
        run: npx prettier --write src/components/storefront/Storefront.tsx src/features/storefront/components/ProductConfigurator.tsx src/features/storefront/components/CheckoutPanel.tsx src/features/cart/components/CartPanel.tsx


      - name: Lint refactored storefront
        run: npx eslint src/components/storefront/Storefront.tsx src/features/storefront/components/ProductConfigurator.tsx src/features/storefront/components/CheckoutPanel.tsx src/features/cart/components/CartPanel.tsx

      - name: Check pilot checkout safety guards
        run: node --experimental-strip-types --test tests/pilot-checkout-guards.test.mjs

      - name: Check server checkout boundary
        run: node --experimental-strip-types --test tests/pilot-checkout-closed.test.mjs

      - name: Check checkout request ingress A/B and HTTP negatives
        run: node --experimental-strip-types --test tests/checkout-gateway.test.mjs

      - name: Check disposable checkout adapter A/B and negative cases
        run: node --experimental-strip-types --test tests/pilot-disposable-checkout-adapter.test.mjs

      - name: Check Master-like disposable RPC contract and capability negatives
        run: node --experimental-strip-types --test tests/pilot-disposable-rpc-backend.test.mjs

      - name: Build
        run: npm run build
