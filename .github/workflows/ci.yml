name: Build and Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/reconnect-storefront-components
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-auth:
    if: github.ref == 'refs/heads/audit/group-addons-integration-20261013'
    uses: ./.github/workflows/integrated-delivery-auth.yml

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install

      - name: Format refactored storefront and candidate gateway
        run: npx prettier --write src/components/storefront/Storefront.tsx src/features/storefront/components/ProductConfigurator.tsx src/features/storefront/components/CheckoutPanel.tsx src/features/cart/components/CartPanel.tsx src/components/storefront/TrackedOrderPanel.tsx src/routes/admin/pedidos.tsx src/server/group-contract.ts src/server/bounded-json.ts src/server/checkout-gateway.ts src/server/checkout-gateway.server.ts src/routes/api/checkout.ts src/server/order-amendment.ts src/server/order-amendment.server.ts src/routes/api/order-amend.ts src/lib/domain/order-amendment-capability.ts

      - name: Lint refactored storefront
        run: npx eslint src/components/storefront/Storefront.tsx src/features/storefront/components/ProductConfigurator.tsx src/features/storefront/components/CheckoutPanel.tsx src/features/cart/components/CartPanel.tsx

      - name: Lint instance-scoped store files
        run: npx eslint src/features/cart/hooks/use-local-cart.ts src/lib/domain/store-context.ts

      - name: Lint gateway files
        run: npx eslint src/routes/admin/pedidos.tsx src/server/group-contract.ts src/server/bounded-json.ts src/server/checkout-gateway.ts src/server/checkout-gateway.server.ts src/routes/api/checkout.ts src/server/order-amendment.ts src/server/order-amendment.server.ts src/routes/api/order-amend.ts src/lib/domain/order-amendment-capability.ts

      - name: Lint shared engine contracts
        run: npx eslint src/core/delivery/group-order-line.ts src/core/delivery/cart-order-lines.ts src/core/delivery/product-options.ts src/core/delivery/services/public-catalog.ts src/core/delivery/services/load-public-store.ts src/core/delivery/content.ts src/components/storefront/TrackedOrderPanel.tsx src/features/storefront/services/load-store.ts src/core/delivery/request-intent.ts src/core/delivery/contracts.ts src/core/delivery/services/store-rules.ts src/core/delivery/customer-details.ts src/core/delivery/backend-binding.ts src/features/storefront/domain/storefront-utils.ts src/lib/domain/types.ts src/integrations/storefront-backend/client.ts

      - name: Store context and gateway contract tests
        run: node --experimental-strip-types --test tests/store-context.test.mjs tests/checkout-gateway.test.mjs tests/order-consumer-safety.test.mjs tests/order-amendment.test.mjs tests/bounded-json.test.mjs tests/engine-integration.test.mjs tests/group-addons.test.mjs

      # The build regenerates the TanStack route tree for /api/checkout.
      - name: Build and regenerate route types
        run: npm run build

      - name: Type-check generated routes
        run: npx tsc --noEmit

      - name: Smoke local TanStack HTTP route with gateway disabled
        env:
          NEROXA_CHECKOUT_GATEWAY_ENABLED: "false"
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/checkout-dev-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          response=""
          for attempt in $(seq 1 35); do
            response=$(curl --max-time 3 --silent --output /dev/null --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{"p_order":{}}' \
              http://127.0.0.1:4173/api/checkout || true)
            if [ "$response" = "503" ]; then
              amendment=$(curl --max-time 3 --silent --output /dev/null --write-out '%{http_code}' \
                --header 'Content-Type: application/json' \
                --data '{}' \
                http://127.0.0.1:4173/api/order-amend || true)
              if [ "$amendment" = "503" ]; then
                echo "PASS: disabled checkout and order amendment HTTP routes return 503"
                exit 0
              fi
            fi
            sleep 1
          done
          echo "FAIL: expected disabled gateway HTTP 503, got $response"
          tail -50 "$RUNNER_TEMP/checkout-dev-server.log"
          exit 1
