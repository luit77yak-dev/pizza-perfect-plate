name: Build and Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/reconnect-storefront-components
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install

      - name: Format refactored storefront and candidate gateway
        run: npx prettier --write src/components/storefront/Storefront.tsx src/features/storefront/components/ProductConfigurator.tsx src/features/storefront/components/CheckoutPanel.tsx src/features/cart/components/CartPanel.tsx src/server/checkout-gateway.ts src/server/checkout-gateway.server.ts src/routes/api/checkout.ts


      - name: Lint refactored storefront
        run: npx eslint src/components/storefront/Storefront.tsx src/features/storefront/components/ProductConfigurator.tsx src/features/storefront/components/CheckoutPanel.tsx src/features/cart/components/CartPanel.tsx

      - name: Lint instance-scoped store files
        run: npx eslint src/features/cart/hooks/use-local-cart.ts src/lib/domain/store-context.ts

      - name: Lint gateway files
        run: npx eslint src/server/checkout-gateway.ts src/server/checkout-gateway.server.ts src/routes/api/checkout.ts

      - name: Store context and gateway contract tests
        run: node --experimental-strip-types --test tests/store-context.test.mjs tests/checkout-gateway.test.mjs

      # The build regenerates the TanStack route tree for /api/checkout.
      - name: Build and regenerate route types
        run: npm run build

      - name: Type-check generated routes
        run: npx tsc --noEmit
