name: Build and Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/reconnect-storefront-components
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install

      - name: Format refactored storefront and candidate gateway
        run: npx prettier --write src/components/storefront/Storefront.tsx src/features/storefront/components/ProductConfigurator.tsx src/features/storefront/components/CheckoutPanel.tsx src/features/cart/components/CartPanel.tsx src/components/storefront/TrackedOrderPanel.tsx src/server/checkout-gateway.ts src/server/checkout-gateway.server.ts src/routes/api/checkout.ts


      - name: Lint refactored storefront
        run: npx eslint src/components/storefront/Storefront.tsx src/features/storefront/components/ProductConfigurator.tsx src/features/storefront/components/CheckoutPanel.tsx src/features/cart/components/CartPanel.tsx

      - name: Lint instance-scoped store files
        run: npx eslint src/features/cart/hooks/use-local-cart.ts src/lib/domain/store-context.ts

      - name: Lint gateway files
        run: npx eslint src/server/checkout-gateway.ts src/server/checkout-gateway.server.ts src/routes/api/checkout.ts

      - name: Store context and gateway contract tests
        run: node --experimental-strip-types --test tests/store-context.test.mjs tests/checkout-gateway.test.mjs tests/order-consumer-safety.test.mjs

      # The build regenerates the TanStack route tree for /api/checkout.
      - name: Build and regenerate route types
        run: npm run build

      - name: Type-check generated routes
        run: npx tsc --noEmit

      - name: Smoke local TanStack HTTP route with gateway disabled
        env:
          NEROXA_CHECKOUT_GATEWAY_ENABLED: "false"
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/checkout-dev-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          response=""
          for attempt in $(seq 1 35); do
            response=$(curl --max-time 3 --silent --output /dev/null --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{"p_order":{}}' \
              http://127.0.0.1:4173/api/checkout || true)
            if [ "$response" = "503" ]; then
              echo "PASS: HTTP handler routes to disabled gateway (503)"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: expected disabled gateway HTTP 503, got $response"
          tail -50 "$RUNNER_TEMP/checkout-preview.log"
          exit 1
