name: Build and Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/reconnect-storefront-components
      - refactor/delivery-engine-foundation
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install

      - name: Format refactored storefront
        run: npx prettier --write src/components/storefront/Storefront.tsx src/features/storefront/themes/types.ts src/features/storefront/themes/resolve.ts src/features/storefront/components/StorefrontHero.tsx src/features/storefront/components/StorefrontHeader.tsx src/features/storefront/components/StorefrontMenu.tsx src/features/storefront/components/StorefrontCategoryNav.tsx src/features/storefront/components/StorefrontAbout.tsx src/features/storefront/components/StorefrontFooter.tsx src/core/delivery/services/load-public-store.ts src/features/storefront/components/ProductConfigurator.tsx src/features/storefront/components/CheckoutPanel.tsx src/features/cart/components/CartPanel.tsx


      - name: Lint refactored storefront
        run: npx eslint src/components/storefront/Storefront.tsx src/features/storefront/themes/types.ts src/features/storefront/themes/resolve.ts src/features/storefront/components/StorefrontHero.tsx src/features/storefront/components/StorefrontHeader.tsx src/features/storefront/components/StorefrontMenu.tsx src/features/storefront/components/StorefrontCategoryNav.tsx src/features/storefront/components/StorefrontAbout.tsx src/features/storefront/components/StorefrontFooter.tsx src/core/delivery/services/load-public-store.ts src/features/storefront/components/ProductConfigurator.tsx src/features/storefront/components/CheckoutPanel.tsx src/features/cart/components/CartPanel.tsx

      - name: Build
        run: npm run build
