name: Build and Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/reconnect-storefront-components
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install

      - name: Format refactored storefront
        run: npx prettier --write src/components/storefront/Storefront.tsx src/features/storefront/components/ProductConfigurator.tsx src/features/storefront/components/CheckoutPanel.tsx src/features/cart/components/CartPanel.tsx


      - name: Lint refactored storefront
        run: npx eslint src/components/storefront/Storefront.tsx src/features/storefront/components/ProductConfigurator.tsx src/features/storefront/components/CheckoutPanel.tsx src/features/cart/components/CartPanel.tsx

      - name: Lint instance-scoped store files
        run: npx eslint src/features/cart/hooks/use-local-cart.ts src/features/storefront/services/load-store.ts src/core/delivery/services/load-public-store.ts src/lib/domain/store-context.ts

      - name: Type-check
        run: npx tsc --noEmit

      - name: Store context contract tests
        run: node --experimental-strip-types --test tests/store-context.test.mjs

      - name: Build
        run: npm run build
