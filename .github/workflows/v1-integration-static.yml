name: NEROXA V1 Integration Static Guard
on:
  push:
    branches:
      - 'integration/v1-cloudflare-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-preflight:
    name: Offline food release guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate guard with synthetic negative tests
        run: node --test tools/integration/guard-release.test.mjs
      - name: Verify food candidate remains closed
        run: node tools/integration/guard-release.mjs food .
